services:
  olfdb:
    build: {context: ., target: web}
    image: olfdb:latest
    container_name: olfdb
    restart: unless-stopped    # also what starts it again after a restart from the Admin tab
    ports:
      - "8080:8000"            # host:container — change 8080 if it clashes
    # Of the server's files, the container sees only these: the most it can ever read or
    # write. The Admin tab can only narrow that (DEPLOY.md, "Folders it may read and write").
    volumes:
      - ./data:/data           # SQLite DB, staging area and every uploaded file
      - ./reference_data:/srv/olfdb/reference_data:ro
      - ./config:/srv/olfdb/config:ro
      - /local/tensor:/local/tensor:ro           # the lab NAS (see DEPLOY.md, "Tensor")
      - /etc/hostname:/etc/host_hostname:ro      # the server's name, for the Admin tab
      - /local/tensor-archive/Betty/olfdb_backups:/local/tensor-archive/Betty/olfdb_backups
      # a folder it may write (for backups from the Admin tab), also to be added there:
      # - /local/tensor/olfdb_backups:/local/tensor/olfdb_backups
    read_only: true            # it cannot change its own image (code, Python), only what is mounted writable
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OLFDB_MAX_UPLOAD_MB: "1024"
      OLFDB_STAGE_TTL_HOURS: "48"
      OLFDB_TENSOR_ROOT: "/local/tensor"
      # this folder on the server (the one docker compose is run from), for the Admin tab
      # to give paths in the container as paths on the server
      OLFDB_HOST_DIR: "${PWD}"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Runs the fits asked for in the AL Segmentation tab (app/fit_worker.py), one at a time, with
  # al-diag-seg on the GPU: the same app, and folders, as the web server's, but an image with PyTorch
  # and al-diag-seg too (about 9 GB), and the only one given the GPU. Needs the NVIDIA Container
  # Toolkit (DEPLOY.md, "GPU"); without a GPU, remove this service (fits then wait, and the tab says so).
  worker:
    build: {context: ., target: worker}
    image: olfdb-worker:latest
    container_name: olfdb-worker
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./reference_data:/srv/olfdb/reference_data:ro
      - ./config:/srv/olfdb/config:ro
      - /local/tensor:/local/tensor:ro
      - /etc/hostname:/etc/host_hostname:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: "8gb"            # PyTorch's shared memory
    environment:
      OLFDB_TENSOR_ROOT: "/local/tensor"
      OLFDB_HOST_DIR: "${PWD}"
      # what PyTorch, CUDA and matplotlib cache: in the data folder, the only one it may write
      XDG_CACHE_HOME: "/data/tmp/cache"
      CUDA_CACHE_PATH: "/data/tmp/cache/cuda"
      MPLCONFIGDIR: "/data/tmp/cache/matplotlib"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
